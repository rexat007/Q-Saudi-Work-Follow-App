name: Secret-free foundation CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required-foundation:
    name: Required foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up project Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Confirm Node and npm authority
        run: |
          node --version
          npm --version
          node -e "if (process.versions.node.split('.')[0] !== '22') process.exit(1)"
          npm_version="$(npm --version)"
          test "${npm_version%%.*}" = '10'
      - name: Clean install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Verify runtime translation keys
        run: npm run test:i18n-runtime
      - name: Verify authentication trust boundary
        run: npm run test:auth-trust-boundary
      - name: Verify repository cleanliness
        if: ${{ always() }}
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          repository_status="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "$repository_status" ]; then
            printf '%s\n' "$repository_status"
            echo '::error::Verification mutated repository state.'
            exit 1
          fi

  typecheck-debt-observability:
    name: Typecheck debt observability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up project Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Confirm Node and npm authority
        run: |
          node --version
          npm --version
          node -e "if (process.versions.node.split('.')[0] !== '22') process.exit(1)"
          npm_version="$(npm --version)"
          test "${npm_version%%.*}" = '10'
      - name: Clean install
        run: npm ci --no-audit --no-fund
      # Preserve the command outcome while tolerating debt in this step only.
      - name: Full-repository typecheck (non-blocking debt observation)
        id: typecheck
        continue-on-error: true
        run: npm run lint
      - name: Report typecheck outcome
        if: ${{ always() }}
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
        run: |
          printf 'TYPECHECK COMMAND RESULT: %s\n' "$TYPECHECK_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TYPECHECK_OUTCOME" = 'failure' ]; then
            echo 'npm run lint failed. TypeScript debt remains present. This is debt observability, intentionally non-blocking for P0-U6 foundation; lint did not PASS. P0-U7 must reassess the unresolved debt.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'FOUNDATION CI RESULT: reported independently by the Required foundation job. Typecheck debt tolerance does not establish foundation success. Mutation guards and all other steps remain blocking; no fixed diagnostic allowance applies.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify repository cleanliness
        if: ${{ always() }}
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          repository_status="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "$repository_status" ]; then
            printf '%s\n' "$repository_status"
            echo '::error::Verification mutated repository state.'
            exit 1
          fi


  postgres-authority:
    name: PostgreSQL 17 authority regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Both job clients and the isolated engine use PG17. No production service.
    container: postgres:17.6-bookworm
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          # Ephemeral, job-private test network only; no stored credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      QSA_TEST_DATABASE_ISOLATED: '1'
      TEST_DATABASE_URL: postgresql://postgres@postgres:5432/qsaudi_sql
      MIGRATION_DATABASE_URL: postgresql://qsa_migrator@postgres:5432/qsaudi_sql
      DATABASE_URL: postgresql://qsa_runtime@postgres:5432/qsaudi_sql
      AUTH_DATABASE_URL: postgresql://qsa_auth@postgres:5432/qsaudi_sql
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up project Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Clean install
        run: npm ci --no-audit --no-fund
      - name: Provision separated isolated database owner
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE qsa_migrator LOGIN CREATEROLE;'
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE qsaudi_sql OWNER qsa_migrator;'
          npx tsx src/db/migrator.ts
      - name: Install isolated browser test tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends chromium
          npm install --prefix "$RUNNER_TEMP/qsa-browser" --no-package-lock --no-save playwright-core@1.65.0
      - name: Register isolated browser location
        run: |
          echo "QSA_BROWSER_TOOL_ROOT=$RUNNER_TEMP/qsa-browser" >> "$GITHUB_ENV"
          echo 'QSA_BROWSER_EXECUTABLE=/usr/bin/chromium' >> "$GITHUB_ENV"
      - name: Verify native SQL authorities without skipped cases
        run: >-
          npx vitest run --no-file-parallelism
          src/tests/ar2U01PostgresInfrastructure.test.ts
          src/tests/ar2U01SecurityGate.test.ts
          src/tests/ar2U01ConnectionCleanup.test.ts
          src/tests/ar2U02CanonicalIdentityMemberships.test.ts
          src/tests/ar2U03TemporalAuthority.test.ts
          src/tests/ar2U04BoundedReads.test.ts
          src/tests/ar2U04PresentationSession.test.ts
          src/tests/ar2U05DurableImport.test.ts
          src/tests/ar2U06TripsPricing.test.ts
          src/tests/ar2U06Rb1Security.test.ts
          src/tests/ar2U06TripPerformance.test.ts
          src/tests/ar2U09RuntimeComposition.test.ts
          src/tests/ar2U09MigrationReadiness.test.ts
          src/tests/ar2U09FirestoreFence.test.ts
      - name: Verify scoped IndexedDB and journal UI in a real browser
        run: >-
          npx vitest run --no-file-parallelism
          src/tests/ar2U07OfflineContinuity.test.ts
          src/tests/ar2U09OfflineBrowser.test.ts
      - name: Verify explicit 148 authority bundle
        run: >-
          npx vitest run
          src/tests/reviewedRosterCommitP8B2.test.ts
          src/tests/rosterExecutionRecoveryP8B3.test.ts
          src/tests/temporalRelationshipAuthority.test.ts
          src/tests/txReadCacheCorrectness.test.ts
